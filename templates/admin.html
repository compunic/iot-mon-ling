<!DOCTYPE html>
<html>
<head>

    <title>Admin Panel</title>

    <style>

        body{
            font-family:Arial;
            padding:20px;
        }

        table{

            width:100%;
            border-collapse:collapse;
        }

        th, td{

            border:1px solid #ddd;
            padding:10px;
        }

        th{
            background:#333;
            color:white;
        }

        a{

            padding:10px 20px;
            background:red;
            color:white;
            text-decoration:none;
            border-radius:5px;
        }

    </style>

</head>
<body>

<h1>Admin Backend</h1>

<p>
    <a href="/delete-all">
        Hapus Semua Data
    </a>
</p>

<table>

<tr>

    <th>ID</th>
    <th>ESP</th>
    <th>Suhu</th>
    <th>Kelembaban</th>
    <th>Amonia</th>
    <th>Pakan</th>
    <th>Waktu</th>

</tr>

{% for row in data %}

<tr>

    <td>{{ row.id }}</td>

    <td>{{ row.nama_esp }}</td>

    <td>{{ row.suhu }}</td>

    <td>{{ row.kelembaban }}</td>

    <td>{{ row.amonia }}</td>

    <td>{{ row.kapasitas_pakan }}%</td>

    <td>{{ row.created_at }}</td>

</tr>

{% endfor %}

</table>

</body>
</html>
