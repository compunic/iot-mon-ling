<!DOCTYPE html>
<html>

<head>

    <title>Admin</title>

    <style>

        body{

            font-family:Arial;
            padding:20px;

        }

        table{

            width:100%;
            border-collapse:collapse;

        }

        th,td{

            border:1px solid #ccc;

            padding:10px;

            text-align:center;

        }

        th{

            background:#eee;

        }

        a{

            display:inline-block;

            margin-bottom:20px;

            padding:10px 15px;

            background:red;

            color:white;

            text-decoration:none;

            border-radius:10px;

        }

    </style>

</head>

<body>

<h1>Admin Monitoring</h1>

<a href="/delete-all">
    Hapus Semua Data
</a>

<table>

<tr>

    <th>ID</th>
    <th>ESP</th>

    <th>Suhu</th>
    <th>Kelembaban</th>
    <th>Amonia</th>

    <th>Pakan</th>

    <th>Status</th>

    <th>Waktu</th>

</tr>

{% for d in data %}

<tr>

    <td>{{ d.id }}</td>

    <td>{{ d.nama_esp }}</td>

    <td>{{ d.suhu }}</td>

    <td>{{ d.kelembaban }}</td>

    <td>{{ d.amonia }}</td>

    <td>{{ d.kapasitas_pakan }}</td>

    <td>{{ d.status }}</td>

    <td>{{ d.created_at }}</td>

</tr>

{% endfor %}

</table>

</body>
</html>
