<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Smart Farming Unggas</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        *{
            box-sizing:border-box;
        }

        body{

            margin:0;
            padding:20px;

            background:#f5f1e8;

            font-family:Arial,sans-serif;

        }

        h1{

            text-align:center;

            color:#6b4f2a;

            margin-bottom:10px;

        }

        .subtitle{

            text-align:center;

            color:#8b5e3c;

            margin-bottom:30px;

        }

        .grid{

            display:grid;

            grid-template-columns:
            repeat(auto-fit,minmax(380px,1fr));

            gap:20px;

        }

        .card{

            background:white;

            border-radius:20px;

            padding:20px;

            box-shadow:0 5px 15px rgba(0,0,0,0.1);

            transition:0.3s;

        }

        .card:hover{

            transform:translateY(-5px);

        }

        .title{

            font-size:22px;

            font-weight:bold;

            color:#8b5e3c;

            margin-bottom:15px;

        }

        .info{

            margin:8px 0;

            font-size:16px;

            color:#333;

        }

        .status{

            padding:8px 14px;

            border-radius:10px;

            color:white;

            display:inline-block;

            margin-top:10px;

            font-weight:bold;

        }

        .AMAN{

            background:green;

        }

        .WASPADA{

            background:orange;

        }

        .BAHAYA{

            background:red;

        }

        .warning{

            margin-top:12px;

            padding:10px;

            border-radius:10px;

            font-weight:bold;

            color:white;

        }

        .warning-danger{

            background:red;

        }

        .warning-warning{

            background:orange;

        }

        .warning-safe{

            background:green;

        }

        .progress-container{

            width:100%;

            background:#ddd;

            border-radius:20px;

            margin-top:10px;

            overflow:hidden;

            height:25px;

        }

        .progress-bar{

            height:100%;

            text-align:center;

            color:white;

            font-weight:bold;

            line-height:25px;

        }

        .bar-high{

            background:green;

        }

        .bar-medium{

            background:orange;

        }

        .bar-low{

            background:red;

        }

        .chart-header{

            margin-top:20px;

            display:flex;

            gap:10px;

            flex-wrap:wrap;

        }

        .chart-filter{

            flex:1;

            min-width:150px;

            padding:10px;

            border-radius:10px;

            border:1px solid #ccc;

            outline:none;

        }

        .custom-range{

            display:none;

            margin-top:10px;

        }

        .custom-range input{

            width:100%;

            margin-bottom:10px;

            padding:10px;

            border-radius:10px;

            border:1px solid #ccc;

        }

        .btn-filter{

            width:100%;

            padding:10px;

            border:none;

            border-radius:10px;

            background:#6b4f2a;

            color:white;

            font-weight:bold;

            cursor:pointer;

        }

        .btn-filter:hover{

            opacity:0.9;

        }

        .chart-container{

            margin-top:20px;

            position:relative;

            height:260px;

        }

        canvas{

            width:100% !important;

            height:100% !important;

        }

        .footer{

            margin-top:40px;

            text-align:center;

            color:#777;

            font-size:14px;

        }

        @media(max-width:768px){

            body{

                padding:10px;

            }

        }

    </style>

</head>

<body>

    <h1>
        🐔 SMART FARMING UNGGAS
    </h1>

    <div class="subtitle">
        Monitoring Realtime Suhu, Amonia, Kelembaban dan Pakan
    </div>

    <div class="grid" id="grid"></div>

    <div class="footer">
        Smart Poultry Monitoring System
    </div>

<script>

const charts = {}

const currentFilters = {}

async function loadDashboard(){

    const response =
    await fetch('/api/latest-all')

    const devices =
    await response.json()

    const grid =
    document.getElementById('grid')

    grid.innerHTML = ""

    for(const d of devices){

        if(!currentFilters[d.nama_esp]){

            currentFilters[d.nama_esp] = {

                filter:'hour',

                start:'',

                end:''

            }

        }

        const currentFilter =
        currentFilters[d.nama_esp]

        const card =
        document.createElement('div')

        card.className = "card"

        let warningClass = "warning-safe"
        let warningText = "✅ PAKAN AMAN"

        let barClass = "bar-high"

        if(d.kapasitas_pakan <= 20){

            warningClass = "warning-danger"
            warningText = "⚠️ PAKAN HAMPIR HABIS"

            barClass = "bar-low"

        }

        else if(d.kapasitas_pakan <= 40){

            warningClass = "warning-warning"
            warningText = "⚠️ PAKAN MENIPIS"

            barClass = "bar-medium"

        }

        card.innerHTML = `

            <div class="title">
                🐔 ${d.nama_esp}
            </div>

            <div class="info">
                🌡️ Suhu :
                <b>${d.suhu} °C</b>
            </div>

            <div class="info">
                💧 Kelembaban :
                <b>${d.kelembaban} %</b>
            </div>

            <div class="info">
                ☣️ Amonia :
                <b>${d.amonia} ppm</b>
            </div>

            <div class="info">
                🌾 Kapasitas Pakan :
                <b>${d.kapasitas_pakan} %</b>
            </div>

            <div class="progress-container">

                <div
                    class="progress-bar ${barClass}"
                    style="width:${d.kapasitas_pakan}%"
                >

                    ${d.kapasitas_pakan}%

                </div>

            </div>

            <div class="warning ${warningClass}">
                ${warningText}
            </div>

            <div class="status ${d.status}">
                ${d.status}
            </div>

            <div class="chart-header">

                <select
                    class="chart-filter"
                    id="filter-${d.nama_esp}"
                    onchange="changeFilter('${d.nama_esp}')"
                >

                    <option
                        value="minute"
                        ${currentFilter.filter === 'minute'
                            ? 'selected'
                            : ''}
                    >
                        Per Menit
                    </option>

                    <option
                        value="hour"
                        ${currentFilter.filter === 'hour'
                            ? 'selected'
                            : ''}
                    >
                        Per Jam
                    </option>

                    <option
                        value="day"
                        ${currentFilter.filter === 'day'
                            ? 'selected'
                            : ''}
                    >
                        Per Hari
                    </option>

                    <option
                        value="week"
                        ${currentFilter.filter === 'week'
                            ? 'selected'
                            : ''}
                    >
                        Per Minggu
                    </option>

                    <option
                        value="month"
                        ${currentFilter.filter === 'month'
                            ? 'selected'
                            : ''}
                    >
                        Per Bulan
                    </option>

                    <option
                        value="custom"
                        ${currentFilter.filter === 'custom'
                            ? 'selected'
                            : ''}
                    >
                        Rentang Waktu
                    </option>

                </select>

            </div>

            <div
                class="custom-range"
                id="custom-${d.nama_esp}"
                style="
                    ${currentFilter.filter === 'custom'
                        ? 'display:block'
                        : 'display:none'}
                "
            >

                <input
                    type="datetime-local"
                    id="start-${d.nama_esp}"
                    value="${currentFilter.start}"
                >

                <input
                    type="datetime-local"
                    id="end-${d.nama_esp}"
                    value="${currentFilter.end}"
                >

                <button
                    class="btn-filter"
                    onclick="applyCustomFilter('${d.nama_esp}')"
                >

                    Terapkan Filter

                </button>

            </div>

            <div class="chart-container">

                <canvas id="chart-${d.nama_esp}"></canvas>

            </div>

        `

        grid.appendChild(card)

        loadChart(

            d.nama_esp,

            currentFilter.filter,

            currentFilter.start,

            currentFilter.end

        )

    }

}

function changeFilter(device){

    const filter =
    document.getElementById(
        `filter-${device}`
    ).value

    const customDiv =
    document.getElementById(
        `custom-${device}`
    )

    if(filter === "custom"){

        customDiv.style.display = "block"

    }

    else{

        customDiv.style.display = "none"

        currentFilters[device] = {

            filter:filter,

            start:'',

            end:''

        }

        loadChart(device, filter)

    }

}

function applyCustomFilter(device){

    const start =
    document.getElementById(
        `start-${device}`
    ).value

    const end =
    document.getElementById(
        `end-${device}`
    ).value

    if(!start || !end){

        alert(
            "Pilih tanggal awal dan akhir"
        )

        return

    }

    currentFilters[device] = {

        filter:'custom',

        start:start,

        end:end

    }

    loadChart(

        device,

        'custom',

        start,

        end

    )

}

async function loadChart(

    device,

    filter='hour',

    start='',

    end=''

){

    let url =
    `/api/history?device=${device}&filter=${filter}`

    if(filter === 'custom'){

        url +=
        `&start=${start}&end=${end}`

    }

    const response =
    await fetch(url)

    const data =
    await response.json()

    const labels =
    data.map(x => {

        if(filter === 'minute'){

            return x.created_at.slice(11,19)

        }

        else if(filter === 'hour'){

            return x.created_at.slice(11,16)

        }

        else{

            return x.created_at.slice(0,10)

        }

    })

    const suhu =
    data.map(x => x.suhu)

    const amonia =
    data.map(x => x.amonia)

    const kelembaban =
    data.map(x => x.kelembaban)

    const pakan =
    data.map(x => x.kapasitas_pakan)

    const ctx =
    document.getElementById(
        `chart-${device}`
    )

    if(charts[device]){

        charts[device].destroy()

    }

    charts[device] = new Chart(ctx,{

        type:'line',

        data:{

            labels:labels,

            datasets:[

                {

                    label:'Suhu',

                    data:suhu,

                    borderWidth:2,

                    tension:0.3

                },

                {

                    label:'Amonia',

                    data:amonia,

                    borderWidth:2,

                    tension:0.3

                },

                {

                    label:'Kelembaban',

                    data:kelembaban,

                    borderWidth:2,

                    tension:0.3

                },

                {

                    label:'Pakan',

                    data:pakan,

                    borderWidth:2,

                    tension:0.3

                }

            ]

        },

        options:{

            responsive:true,

            maintainAspectRatio:false,

            interaction:{

                mode:'index',

                intersect:false

            },

            plugins:{

                legend:{

                    display:true,

                    position:'bottom'

                }

            },

            scales:{

                y:{

                    beginAtZero:true

                }

            }

        }

    })

}

loadDashboard()

setInterval(
    loadDashboard,
    5000
)

</script>

</body>
</html>
