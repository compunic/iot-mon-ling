<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <title>Smart Farming Unggas</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{

            margin:0;
            padding:20px;

            background:#f5f1e8;

            font-family:Arial;

        }

        h1{

            text-align:center;

            color:#6b4f2a;

        }

        .grid{

            display:grid;

            grid-template-columns:
            repeat(auto-fit,minmax(350px,1fr));

            gap:20px;

            margin-top:30px;

        }

        .card{

            background:white;

            border-radius:20px;

            padding:20px;

            box-shadow:0 5px 15px rgba(0,0,0,0.1);

        }

        .title{

            font-size:22px;

            font-weight:bold;

            color:#8b5e3c;

            margin-bottom:15px;

        }

        .info{

            margin:5px 0;

            font-size:16px;

        }

        .status{

            padding:8px 12px;

            border-radius:10px;

            color:white;

            display:inline-block;

            margin-top:10px;

            font-weight:bold;

        }

        .AMAN{

            background:green;

        }

        .WASPADA{

            background:orange;

        }

        .BAHAYA{

            background:red;

        }

        canvas{

            margin-top:20px;

            max-height:180px;

        }

    </style>

</head>

<body>

    <h1>
        🐔 SMART FARMING UNGGAS
    </h1>

    <div class="grid" id="grid"></div>

<script>

async function loadDashboard(){

    const response =
    await fetch('/api/latest-all')

    const devices =
    await response.json()

    const grid =
    document.getElementById('grid')

    grid.innerHTML = ""

    for(const d of devices){

        const card =
        document.createElement('div')

        card.className = "card"

        card.innerHTML = `

            <div class="title">
                🐔 ${d.nama_esp}
            </div>

            <div class="info">
                🌡️ Suhu : ${d.suhu} °C
            </div>

            <div class="info">
                💧 Kelembaban : ${d.kelembaban} %
            </div>

            <div class="info">
                ☣️ Amonia : ${d.amonia} ppm
            </div>

            <div class="info">
                🌾 Pakan : ${d.kapasitas_pakan} %
            </div>

            <div class="status ${d.status}">
                ${d.status}
            </div>

            <canvas id="chart-${d.nama_esp}"></canvas>

        `

        grid.appendChild(card)

        loadChart(d.nama_esp)

    }

}

async function loadChart(device){

    const response =
    await fetch(
        `/api/history?device=${device}&filter=hour`
    )

    const data =
    await response.json()

    const labels =
    data.map(x => x.created_at.slice(11,16))

    const suhu =
    data.map(x => x.suhu)

    const amonia =
    data.map(x => x.amonia)

    const kelembaban =
    data.map(x => x.kelembaban)

    const ctx =
    document.getElementById(
        `chart-${device}`
    )

    new Chart(ctx,{

        type:'line',

        data:{

            labels:labels,

            datasets:[

                {

                    label:'Suhu',

                    data:suhu,

                    borderWidth:2

                },

                {

                    label:'Amonia',

                    data:amonia,

                    borderWidth:2

                },

                {

                    label:'Kelembaban',

                    data:kelembaban,

                    borderWidth:2

                }

            ]

        },

        options:{

            responsive:true,

            plugins:{

                legend:{

                    display:true

                }

            }

        }

    })

}

loadDashboard()

setInterval(
    loadDashboard,
    5000
)

</script>

</body>
</html>
